name: Hermes Lifetime

on:
  workflow_dispatch:
  schedule:
    - cron: '50 */5 * * *'

concurrency:
  group: hermes-lifetime
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  lifetime:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Restore Hermes state from branch hermes-state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          mkdir -p "$HOME/.hermes" hermes-backup
          git fetch origin hermes-state:hermes-state 2>/dev/null || true
          if git show-ref --verify --quiet refs/heads/hermes-state || git show-ref --verify --quiet refs/remotes/origin/hermes-state; then
            echo "Found hermes-state branch — extracting..."
            git archive origin/hermes-state 2>/dev/null | tar -x -C hermes-backup/ 2>/dev/null || \
            git checkout hermes-state -- . 2>/dev/null || true
            if [ -d hermes-backup/.hermes ]; then
              rsync -a hermes-backup/.hermes/ "$HOME/.hermes/" || true
            elif [ -d hermes-backup/hermes ]; then
              rsync -a hermes-backup/hermes/ "$HOME/.hermes/" || true
            else
              for f in SOUL.md config.yaml state.db state.db-wal state.db-shm; do
                [ -f "hermes-backup/$f" ] && cp -a "hermes-backup/$f" "$HOME/.hermes/" || true
              done
              [ -d hermes-backup/memories ] && rsync -a hermes-backup/memories/ "$HOME/.hermes/memories/" || true
              [ -d hermes-backup/skills ] && rsync -a hermes-backup/skills/ "$HOME/.hermes/skills/" || true
            fi
            echo "Restored from hermes-state branch"
            ls -la "$HOME/.hermes" || true
            ls -la "$HOME/.hermes/memories" 2>/dev/null || true
            [ -f "$HOME/.hermes/SOUL.md" ] && head -5 "$HOME/.hermes/SOUL.md" || echo "NO SOUL.md"
          else
            echo "No hermes-state branch yet (first run)"
          fi
          # Seed SOUL from repo if still missing
          if [ ! -s "$HOME/.hermes/SOUL.md" ] && [ -f SOUL.md ]; then
            cp SOUL.md "$HOME/.hermes/SOUL.md"
            echo "Seeded SOUL.md from repo"
          fi

      - name: Cache fallback restore
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.hermes
            hermes-backup
          key: hermes-state-${{ github.repository }}-${{ github.run_id }}
          restore-keys: |
            hermes-state-${{ github.repository }}-
            hermes-state-

      - name: Bootstrap & Run Session
        env:
          XKIRO_API_KEY: ${{ secrets.XKIRO_API_KEY }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENCODE_ZEN_API_KEY: ${{ secrets.OPENCODE_ZEN_API_KEY }}
          AISUBSCRIPTION_API_KEY: ${{ secrets.AISUBSCRIPTION_API_KEY }}
          MIAROUTER_API_KEY: ${{ secrets.MIAROUTER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_USERS: ${{ secrets.TELEGRAM_ALLOWED_USERS }}
          HERMES_DASHBOARD_BASIC_AUTH_USERNAME: ${{ secrets.HERMES_DASHBOARD_BASIC_AUTH_USERNAME }}
          HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ${{ secrets.HERMES_DASHBOARD_BASIC_AUTH_PASSWORD }}
          HERMES_DASHBOARD_BASIC_AUTH_SECRET: ${{ secrets.HERMES_DASHBOARD_BASIC_AUTH_SECRET }}
          FIGMA_PAT: ${{ secrets.FIGMA_PAT }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_BASE_URL: ${{ secrets.GEMINI_BASE_URL }}
          OLLAMA_BASE_URL: ${{ secrets.OLLAMA_BASE_URL }}
          DASHBOARD_PORT: "9119"
          BACKUP_ROOT: ${{ github.workspace }}/hermes-backup
        run: |
          chmod +x scripts/*.sh scripts/*.py 2>/dev/null || true
          mkdir -p hermes-backup "$HOME/.hermes"
          export HERMES_HOME="$HOME/.hermes"
          export BACKUP_ROOT="${{ github.workspace }}/hermes-backup"
          # Force all providers with base_url BEFORE gateway starts
          python3 scripts/merge_providers.py || true
          ./scripts/run-session.sh

      - name: Final backup to disk
        if: always()
        run: |
          export HERMES_HOME="$HOME/.hermes"
          export BACKUP_ROOT="${{ github.workspace }}/hermes-backup"
          bash scripts/persist-hermes.sh backup || true
          bash scripts/persist-hermes.sh status || true

      - name: Push state to hermes-state branch (durable)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          export HERMES_HOME="$HOME/.hermes"
          STAGE="${{ github.workspace }}/state-stage"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/.hermes"
          # NEVER commit .env — repo is public. Keys must be in GitHub Secrets.
          rsync -a --exclude='cache/' --exclude='__pycache__/' --exclude='*.tmp' --exclude='*.lock' --exclude='.env' \
            "$HERMES_HOME/" "$STAGE/.hermes/" 2>/dev/null || true
          if [ -f "$HERMES_HOME/.env" ]; then
            grep -E '^[A-Z0-9_]+=' "$HERMES_HOME/.env" | cut -d= -f1 > "$STAGE/.hermes/KEY_NAMES.txt" || true
          fi
          cd "$STAGE"
          git init -q
          git config user.email "hermes-lifetime[bot]@users.noreply.github.com"
          git config user.name "Hermes Lifetime Bot"
          git checkout -b hermes-state
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "state snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ) run=${{ github.run_id }}"
            git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
            git push -f origin hermes-state
            echo "Pushed hermes-state branch successfully"
          fi

      - name: Save cache (secondary)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.hermes
            hermes-backup
          key: hermes-state-${{ github.repository }}-${{ github.run_id }}

      - name: Trigger next session
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Queuing next session in 30s..."
          sleep 30
          gh workflow run "Hermes Lifetime" --repo "${{ github.repository }}" || \
          gh workflow run hermes.yml --repo "${{ github.repository }}" || true
