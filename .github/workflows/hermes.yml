name: Hermes Lifetime

on:
  workflow_dispatch:
  schedule:
    - cron: '50 */5 * * *'

concurrency:
  group: hermes-lifetime
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  lifetime:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    env:
      # Private state store (memory, session, .env, SOUL)
      STATE_REPO: azascloud-cell/model-hermes
      STATE_BRANCH: main

    steps:
      - name: Checkout public runner repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Restore state from private repo (model-hermes)
        env:
          STATE_REPO_TOKEN: ${{ secrets.STATE_REPO_TOKEN }}
        run: |
          set -e
          mkdir -p "$HOME/.hermes" hermes-backup

          if [ -z "${STATE_REPO_TOKEN:-}" ]; then
            echo "WARNING: STATE_REPO_TOKEN secret missing — cannot restore from private repo"
            echo "Add secret STATE_REPO_TOKEN (PAT with repo scope) in this public repo."
          else
            STAGE="${{ github.workspace }}/state-pull"
            rm -rf "$STAGE"
            echo "Cloning private state repo ${STATE_REPO}..."
            git clone --depth 1 --branch "${STATE_BRANCH}" \
              "https://x-access-token:${STATE_REPO_TOKEN}@github.com/${STATE_REPO}.git" \
              "$STAGE" 2>/dev/null || \
            git clone --depth 1 \
              "https://x-access-token:${STATE_REPO_TOKEN}@github.com/${STATE_REPO}.git" \
              "$STAGE" 2>/dev/null || true

            if [ -d "$STAGE" ]; then
              if [ -d "$STAGE/.hermes" ]; then
                rsync -a "$STAGE/.hermes/" "$HOME/.hermes/" || true
              else
                # flat layout support
                for f in SOUL.md config.yaml .env state.db state.db-wal state.db-shm; do
                  [ -f "$STAGE/$f" ] && cp -a "$STAGE/$f" "$HOME/.hermes/" || true
                done
                [ -d "$STAGE/memories" ] && rsync -a "$STAGE/memories/" "$HOME/.hermes/memories/" || true
                [ -d "$STAGE/skills" ] && rsync -a "$STAGE/skills/" "$HOME/.hermes/skills/" || true
              fi
              echo "Restored from private repo ${STATE_REPO}"
              ls -la "$HOME/.hermes" || true
              ls -la "$HOME/.hermes/memories" 2>/dev/null || true
              if [ -f "$HOME/.hermes/.env" ]; then
                echo "--- .env keys present ---"
                grep -E '^[A-Z0-9_]+=' "$HOME/.hermes/.env" | cut -d= -f1 | tr '\n' ' '
                echo
              else
                echo "--- .env: missing after restore ---"
              fi
              [ -f "$HOME/.hermes/SOUL.md" ] && { echo "--- SOUL.md ---"; head -5 "$HOME/.hermes/SOUL.md"; } || echo "NO SOUL.md"
            else
              echo "Private repo empty or clone failed (first run is OK)"
            fi
          fi

          # Seed SOUL from public repo if still missing
          if [ ! -s "$HOME/.hermes/SOUL.md" ] && [ -f SOUL.md ]; then
            cp SOUL.md "$HOME/.hermes/SOUL.md"
            echo "Seeded SOUL.md from public repo"
          fi

      - name: Cache fallback restore
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.hermes
            hermes-backup
          key: hermes-state-${{ github.repository }}-${{ github.run_id }}
          restore-keys: |
            hermes-state-${{ github.repository }}-
            hermes-state-

      - name: Bootstrap & Run Session
        env:
          XKIRO_API_KEY: ${{ secrets.XKIRO_API_KEY }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENCODE_ZEN_API_KEY: ${{ secrets.OPENCODE_ZEN_API_KEY }}
          AISUBSCRIPTION_API_KEY: ${{ secrets.AISUBSCRIPTION_API_KEY }}
          MIAROUTER_API_KEY: ${{ secrets.MIAROUTER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_USERS: ${{ secrets.TELEGRAM_ALLOWED_USERS }}
          HERMES_DASHBOARD_BASIC_AUTH_USERNAME: ${{ secrets.HERMES_DASHBOARD_BASIC_AUTH_USERNAME }}
          HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ${{ secrets.HERMES_DASHBOARD_BASIC_AUTH_PASSWORD }}
          HERMES_DASHBOARD_BASIC_AUTH_SECRET: ${{ secrets.HERMES_DASHBOARD_BASIC_AUTH_SECRET }}
          FIGMA_PAT: ${{ secrets.FIGMA_PAT }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_BASE_URL: ${{ secrets.GEMINI_BASE_URL }}
          OLLAMA_BASE_URL: ${{ secrets.OLLAMA_BASE_URL }}
          DASHBOARD_PORT: "9119"
          BACKUP_ROOT: ${{ github.workspace }}/hermes-backup
        run: |
          chmod +x scripts/*.sh scripts/*.py 2>/dev/null || true
          mkdir -p hermes-backup "$HOME/.hermes"
          export HERMES_HOME="$HOME/.hermes"
          export BACKUP_ROOT="${{ github.workspace }}/hermes-backup"
          python3 scripts/merge_providers.py || true
          ./scripts/run-session.sh

      - name: Final backup to disk
        if: always()
        run: |
          export HERMES_HOME="$HOME/.hermes"
          export BACKUP_ROOT="${{ github.workspace }}/hermes-backup"
          bash scripts/persist-hermes.sh backup || true
          bash scripts/persist-hermes.sh status || true

      - name: Push full state to private repo (incl .env)
        if: always()
        env:
          STATE_REPO_TOKEN: ${{ secrets.STATE_REPO_TOKEN }}
        run: |
          set -e
          if [ -z "${STATE_REPO_TOKEN:-}" ]; then
            echo "ERROR: STATE_REPO_TOKEN missing — state NOT saved to private repo"
            exit 0
          fi

          export HERMES_HOME="$HOME/.hermes"
          STAGE="${{ github.workspace }}/state-push"
          rm -rf "$STAGE"

          git clone --depth 1 \
            "https://x-access-token:${STATE_REPO_TOKEN}@github.com/${STATE_REPO}.git" \
            "$STAGE" 2>/dev/null || {
              mkdir -p "$STAGE"
              cd "$STAGE"
              git init -q
              git remote add origin "https://x-access-token:${STATE_REPO_TOKEN}@github.com/${STATE_REPO}.git"
            }

          cd "$STAGE"
          git config user.email "hermes-lifetime[bot]@users.noreply.github.com"
          git config user.name "Hermes Lifetime Bot"
          git checkout -B "${STATE_BRANCH}" 2>/dev/null || git checkout -b "${STATE_BRANCH}"

          mkdir -p .hermes
          # Full state INCLUDING .env (private repo — safe)
          rsync -a --delete \
            --exclude='cache/' --exclude='__pycache__/' --exclude='*.tmp' --exclude='*.lock' \
            "$HERMES_HOME/" .hermes/ 2>/dev/null || true

          # README so repo is not empty-looking
          cat > README.md << 'EOF'
          # Hermes private state store

          Auto-updated by hermes-lifetime (public runner).
          Contains SOUL, MEMORY, USER, state.db, config, .env — do not make public.
          EOF

          git add -A
          if git diff --cached --quiet; then
            echo "Nothing new to commit"
          else
            git commit -m "state $(date -u +%Y-%m-%dT%H:%M:%SZ) run=${{ github.run_id }}"
            git push -u origin "${STATE_BRANCH}" --force
            echo "Pushed full state (incl .env) to ${STATE_REPO}"
          fi

          # Show what keys were saved (names only)
          if [ -f .hermes/.env ]; then
            echo "Saved .env keys:"
            grep -E '^[A-Z0-9_]+=' .hermes/.env | cut -d= -f1
          fi

      - name: Save cache (secondary)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.hermes
            hermes-backup
          key: hermes-state-${{ github.repository }}-${{ github.run_id }}

      - name: Trigger next session
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Queuing next session in 30s..."
          sleep 30
          gh workflow run "Hermes Lifetime" --repo "${{ github.repository }}" || \
          gh workflow run hermes.yml --repo "${{ github.repository }}" || true
