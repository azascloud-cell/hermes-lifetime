name: Hermes Lifetime

on:
  workflow_dispatch:
  schedule:
    - cron: '50 */5 * * *'

concurrency:
  group: hermes-lifetime
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  lifetime:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    env:
      STATE_REPO: ${{ github.repository }}
      STATE_BRANCH: hermes-state

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Restore state (branch hermes-state)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATE_REPO_TOKEN: ${{ secrets.STATE_REPO_TOKEN }}
        run: |
          chmod +x scripts/*.sh scripts/*.py 2>/dev/null || true
          export HERMES_HOME="$HOME/.hermes"
          bash scripts/restore-state.sh

      - name: Cache fallback
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.hermes
            hermes-backup
          key: hermes-state-${{ github.run_id }}
          restore-keys: |
            hermes-state-

      - name: Run session
        env:
          XKIRO_API_KEY: ${{ secrets.XKIRO_API_KEY }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENCODE_ZEN_API_KEY: ${{ secrets.OPENCODE_ZEN_API_KEY }}
          AISUBSCRIPTION_API_KEY: ${{ secrets.AISUBSCRIPTION_API_KEY }}
          MIAROUTER_API_KEY: ${{ secrets.MIAROUTER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_USERS: ${{ secrets.TELEGRAM_ALLOWED_USERS }}
          HERMES_DASHBOARD_BASIC_AUTH_USERNAME: ${{ secrets.HERMES_DASHBOARD_BASIC_AUTH_USERNAME }}
          HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ${{ secrets.HERMES_DASHBOARD_BASIC_AUTH_PASSWORD }}
          HERMES_DASHBOARD_BASIC_AUTH_SECRET: ${{ secrets.HERMES_DASHBOARD_BASIC_AUTH_SECRET }}
          FIGMA_PAT: ${{ secrets.FIGMA_PAT }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_BASE_URL: ${{ secrets.GEMINI_BASE_URL }}
          OLLAMA_BASE_URL: ${{ secrets.OLLAMA_BASE_URL }}
          DASHBOARD_PORT: "9119"
          BACKUP_ROOT: ${{ github.workspace }}/hermes-backup
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATE_REPO: ${{ github.repository }}
          STATE_BRANCH: hermes-state
        run: |
          chmod +x scripts/*.sh scripts/*.py 2>/dev/null || true
          mkdir -p hermes-backup "$HOME/.hermes"
          export HERMES_HOME="$HOME/.hermes"
          export BACKUP_ROOT="${{ github.workspace }}/hermes-backup"
          python3 scripts/merge_providers.py || true

          # Mid-session save every 20 min to hermes-state branch
          (
            while true; do
              sleep 1200
              echo "[mid] saving state to branch..."
              bash scripts/push-state.sh || echo "[mid] push failed"
            done
          ) & echo $! > /tmp/mid-push.pid

          ./scripts/run-session.sh

      - name: Final local backup
        if: always()
        run: |
          export HERMES_HOME="$HOME/.hermes"
          export BACKUP_ROOT="${{ github.workspace }}/hermes-backup"
          bash scripts/persist-hermes.sh backup || true
          bash scripts/persist-hermes.sh status || true

      - name: Push state to hermes-state branch
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATE_REPO: ${{ github.repository }}
          STATE_BRANCH: hermes-state
        run: |
          export HERMES_HOME="$HOME/.hermes"
          bash scripts/push-state.sh

      - name: Save cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.hermes
            hermes-backup
          key: hermes-state-${{ github.run_id }}

      - name: Next session
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sleep 20
          gh workflow run "Hermes Lifetime" --repo "${{ github.repository }}" || true
